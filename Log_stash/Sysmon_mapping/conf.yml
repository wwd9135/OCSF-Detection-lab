The event is not fully OCSF-valid yet. The next corrections are:
- Remove message, because it duplicates raw_data.
- Map process.user into an OCSF user object rather than storing a string.
- Nest the parent executable under process.parent_process.file.path.
- Split the hash string into structured MD5, SHA-256, and IMPHASH values.
- Convert created_time into an OCSF epoch-millisecond timestamp.
- Decide whether device.ip should contain one address or whether the addresses should use an OCSF list field.
- Clean up the leftover ECS/Winlogbeat fields after retaining anything useful.

input {
  beats {
    port => 5044
  }
}

filter {
  if [winlog][provider_name] == "Microsoft-Windows-Sysmon" and
     [winlog][event_id] == "1" {

    mutate {
      add_field => {
        "category_uid"  => "1"
        "category_name" => "System Activity"

        "class_uid"     => "1007"
        "class_name"    => "Process Activity"

        "activity_id"   => "1"
        "activity_name" => "Launch"

        "type_uid"      => "100701"
        "type_name"     => "Process Activity Launch"

        "severity_id"   => "1"

        "[metadata][version]"              => "1.8.0"
        "[metadata][product][name]"        => "Sysmon"
        "[metadata][product][vendor_name]" => "Microsoft"
      }
    }
    mutate {
      remove_field => 
       ["message"]
    }
    mutate {
      convert => {
        "severity_id"   => "integer"
        "activity_id"   => "integer"
        "class_uid"      => "integer"
        "type_uid"       => "integer"
        "category_uid"   => "integer"
      }
    }
    mutate {
      rename => {
        "[event][original]"                           => "raw_data"
        "[winlog][event_data][ProcessId]"             => "[process][pid]"
        "[winlog][event_data][ProcessGuid]"           => "[process][uid]"
        "[winlog][event_data][CommandLine]"           => "[process][cmd_line]"
        "[winlog][event_data][UtcTime]"               => "[process][created_time]"
        "[winlog][event_data][Image]"                 => "[process][file][path]"
        "[winlog][event_data][CurrentDirectory]"      => "[process][working_directory]"
        "[winlog][event_data][OriginalFileName]"      => "[process][file][internal_name]"
        "[winlog][event_data][User]"                  => "[process][user]"
        "[winlog][event_data][ParentProcessId]"       => "[process][parent_process][pid]"
        "[winlog][event_data][ParentImage]"           => "[process][parent_process][path]"
        "[winlog][event_data][ParentCommandLine]"     => "[process][parent_process][cmd_line]"
        "[winlog][event_data][Hashes]"                => "[process][file][hashes]"
        "[host][hostname]"                            => "[device][hostname]"
        "[host][ip][1]"                               => "[device][ip]"
      }
    }
    mutate {
      convert => {
        "[process][pid]"                 => "integer"
        "[process][parent_process][pid]" => "integer"
      }
    }
  }
}

output {
  stdout {
    codec => rubydebug
  }
}
