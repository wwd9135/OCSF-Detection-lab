input {
  beats {
    port => 5044
  }
}

filter {
  if [winlog][provider_name] == "Microsoft-Windows-Security-Auditing" and
     [winlog][event_id] == "4768" {

    mutate {
      add_field => {
        "category_uid"  => "3"
        "category_name" => "Identity & Access Management"

        "class_uid"  => "3002"
        "class_name" => "Authentication"

        "activity_id"   => "3"
        "activity_name" => "Authentication Ticket"

        "type_uid"  => "300203"
        "type_name" => "Authentication: Authentication Ticket"

        "auth_protocol_id" => "2"
        "auth_protocol"    => "Kerberos"

        "severity_id" => "1"
        "severity"    => "Informational"

        "[metadata][version]"              => "1.8.0"
        "[metadata][product][name]"        => "Windows Security Auditing"
        "[metadata][product][vendor_name]" => "Microsoft"
        "[metadata][log_source]"           => "%{[winlog][computer_name]}:%{[winlog][channel]}"
        "[metadata][original_event_uid]"   => "%{[winlog][computer_name]}:%{[winlog][channel]}:%{[winlog][record_id]}"
      }
    }

    mutate {
      rename => {
        "[event][original]"                           => "[raw_data]"
        "[winlog][event_data][TargetUserName]"        => "[user][name]"
        "[winlog][event_data][TargetDomainName]"      => "[user][domain]"
        "[winlog][event_data][TargetSid]"             => "[user][uid]"

        "[winlog][event_data][IpAddress]"             => "[src_endpoint][ip]"
        "[winlog][event_data][IpPort]"                => "[src_endpoint][port]"

        "[winlog][event_data][ServiceName]"           => "[service][name]"
        "[winlog][event_data][ServiceSid]"            => "[service][uid]"


        "[winlog][event_data][Status]"                => "[status_code]"
        "[winlog][event_id]"                          => "[metadata][event_code]"
        "[winlog][provider_name]"                     => "[metadata][log_provider]"
        "[winlog][version]"                           => "[metadata][log_version]"
      }
    }

    ruby {
      code => '
        require "time"

        to_time = lambda do |value|
          begin
            if value.nil?
              nil
            elsif value.respond_to?(:time)
              value.time.utc
            elsif value.is_a?(Time)
              value.utc
            else
              Time.parse(value.to_s).utc
            end
          rescue ArgumentError, TypeError
            nil
          end
        end

        source_time = event.get("[@metadata][event_time]") || event.get("@timestamp")
        event_time = to_time.call(source_time)
        original_time = source_time

        if original_time
          event.set("[metadata][original_time]", original_time.to_s)
        end

        if event_time
          epoch_ms = (event_time.to_f * 1000).round
          iso_time = event_time.iso8601(3)
          event.set("[time]", epoch_ms)
          event.set("[time_dt]", iso_time)
          event.set("[timezone_offset]", 0)
        else
          event.tag("_ocsf_event_time_parse_failure")
        end
      '
    }

    if [status_code] == "0x0" {
      mutate {
        add_field => {
          "status_id" => "1"
          "status"    => "Success"
        }
      }
    } else {
      mutate {
        add_field => {
          "status_id" => "2"
          "status"    => "Failure"
        }
      }
    }


    mutate {
      convert => {
        "category_uid"            => "integer"
        "class_uid"               => "integer"
        "activity_id"             => "integer"
        "type_uid"                => "integer"
        "auth_protocol_id"        => "integer"
        "severity_id"             => "integer"
        "status_id"               => "integer"
        "[metadata][log_version]" => "string"
        "[src_endpoint][port]"    => "integer"

      }
    }

    mutate {
      gsub => [
        "[src_endpoint][ip]", "^::ffff:", ""
      ]
    }

    translate {
      source => "[winlog][event_data][TicketEncryptionType]"
      target => "[unmapped][windows][ticket_encryption_type]"
      dictionary => {
        "0x1"  => "DES-CBS"
        "0x3"  => "DES-CBS-MD5"
        "0x12" => "AES-256"
        "0x17" => "RC4-HMAC"
        "0x18" => "RC4-HMAC-EXP"
      }
      fallback => "Unmapped encrpytion protocol"
    }
    mutate {
      remove_field => [
        "winlog",
        "host",
        "event",
        "agent",
        "ecs",
        "log",
        "@timestamp",
        "@version",
        "message",
        "tags"
      ]
    }
  }
}

output {
  stdout {
    codec => rubydebug
  }
}
